# Скопируйте в config.yaml (он в .gitignore) и заполните.
# Доступы здесь НЕ хранятся. Переменные окружения:
#   NOTION_TOKEN       — внутренняя интеграция корпоративного Notion (выдаёт администратор Notion)
#   FINDYMAIL_API_KEY  — поиск исполнителей и email (необязательно; без ключа люди ищутся только в вебе,
#                        а найденные без email уходят со статусом «нужно обогатить»)
#   YOUTUBE_API_KEY    — YouTube Data API для корпуса (необязательно)

notion:
  api_version: "2025-09-03"
  accounts_data_source_id: "REPLACE_ME"
  contacts_data_source_id: "REPLACE_ME"
  output_parent_page_id: "REPLACE_ME"   # страница, внутри которой создаются карточки аккаунтов

  accounts:                              # корпоративная база «Компании» (по скриншоту 9 Nov 2026)
    company: "Название"                  # title
    domain: "Домен"                      # текст; ключ дедупа
    domain_kind: "rich_text"             # Домен — текстовое поле (в личной базе было url)
    segment: "Сегмент"                   # select ICP-1…8
    country: "Страна"                    # select
    fact: "Обоснование ICP"              # текст: что делает компания и почему в ICP
    source: "Источник"                   # select: Apollo / Стартовая база / Pipeline
    trigger: "Триггер"                   # текст: уже найденный повод — подсказка исследованию
    trigger_url: "Ссылка на триггер"     # url
    owner: "Owner"                       # people: заполнен → компания в работе, воронка не трогает
    # Нужно добавить разработчику (пока пусто — воронка работает без них):
    size: ""                             # «Размер» (текст): без него каждая компания считается средней
    size_source: ""                      # «Размер — источник» (url)
    funnel_status: ""                    # «Воронка — статус» (select): что воронка уже обработала
    funnel_page: ""                      # «Воронка — карточка» (url)
    # В корпоративной базе нет — не используются:
    account_id: ""
    priority: ""                         # приоритет выводится из сегмента (sourcing.priority_by_segment)
    status: ""
    role: ""
    hypothesis: ""
    value: ""
    question: ""
    fallback: ""
    notes: ""                            # нет поля заметок → пометки уверенности пишутся в «Обоснование ICP»
    segment_confidence: ""
    size_status: ""

  contacts:                              # база контактов (по скриншоту шапки 9 Nov 2026)
    company: "Компания"                  # relation на базу аккаунтов
    company_match: "relation"
    name: "Имя"                          # title
    title: "Роль"                        # text
    function: "Персона"                  # select: Operations / CEO или основатель / Product / Risk / Payments …
    email: "Email"
    linkedin: "LinkedIn"
    country: "Страна компании"           # rollup
    warm_intro: "Тёплое интро через"     # заполнено → не в холодную цепочку, в карточке «тёплый путь»
    defect: "Брак: причина"              # заполнено → контакт пропускается
    status: "Статус"                     # status
    source: "Источник"                   # select
    write:
      new_contact_function: "Operations"
      new_leader_function: "CEO или основатель"   # найденный фаундер / CEO / COO
      new_contact_source: "Pipeline"           # select-опция создастся сама
      status_needs_enrichment: "Нужно обогатить"  # ОПЦИЮ СТАТУСА НУЖНО СОЗДАТЬ ВРУЧНУЮ (API не создаёт опции status)
      status_ready: "Готов"
      # Поля эксперимента на строках контактов. Создайте их в базе (select / url / number) и впишите названия:
      offer_type: ""        # select: PREBUILD / BACKTEST / REPLAY
      trigger_type: ""      # select: BUILDING / CHANGE / SCALE / MARKET
      cohort: ""            # select: company / market
      confidence: ""        # select: EVENT / INTERPRETATION
      card: ""              # url: карточка аккаунта
      start_day: ""         # number: 1 или 3 (снизу вверх)

selection:
  priorities: ["P1", "P2"]
  skip_with_owner: true      # Owner назначается после подготовки батча; назначен — компанию не трогаем
  skip_funnel_statuses: ["Черновик на ревью"]   # работает, когда появится поле «Воронка — статус»
  exclude_statuses: ["Research hold"]
  exclude_segments: ["ICP-8 P2P / crowdfunding — control"]
  allowed_functions: ["Operations", "CEO или основатель", "Payments", "Finance"]
  require_contact: false     # аккаунты без контактов тоже берём: людей находит этап people
  batch_size: 20
  parallel: 3

gates:
  min_trigger_rate: 0.7      # доля аккаунтов с проверенным поводом; ниже — письма не пишутся
  min_people_rate: 0.7       # доля аккаунтов, где снизу вверх выполнимо; ниже — стоп
  max_review_fail: 0.2       # доля отказов проверок/рецензента; выше — публикация останавливается
  measure_accounts: 30
  measure_segments:
    - "ICP-1 PSP / acquiring"
    - "ICP-2 Fintech / wallets / neobanks"
    - "ICP-3 Cards / issuing / BaaS"
    - "ICP-4 Cross-border / FX / PayFi"
    - "ICP-5 Digital assets / crypto / RWA"
    - "ICP-6 Investments / wealthtech"
    - "ICP-7 Lending / credit / BNPL"

sourcing:                    # этап source — наполнение базы (SPEC §12)
  targets:                   # сколько аккаунтов должно быть в сегменте; добираем только дефицит
    "ICP-3 Cards / issuing / BaaS": 45
    "ICP-5 Digital assets / crypto / RWA": 45
    "ICP-6 Investments / wealthtech": 45
  regions:                   # регион → страны (варианты написания тоже, сверка без учёта регистра)
    SEA: ["Singapore", "Indonesia", "Malaysia", "Thailand", "Philippines", "Vietnam", "Viet Nam", "Cambodia"]
    GCC: ["United Arab Emirates", "UAE", "Saudi Arabia", "KSA", "Qatar", "Bahrain", "Kuwait", "Oman"]
    LATAM_AFRICA: ["Brazil", "Mexico", "Colombia", "Argentina", "Chile", "Peru", "Nigeria", "Kenya",
                   "South Africa", "Egypt", "Ghana", "Morocco"]
  # регионы — поровну (решение Ильи 9 Nov 2026: ОАЭ и Сингапур уже наполнены, добираем поверх)
  rounds: 3                  # заходы поиска на ячейку: реестры → рейтинги и каталоги → новости
  per_call: 15
  exclude_statuses: ["Research hold"]
  priority_by_segment:       # по документу «HAIA — Financial Buyer Discovery ICP»; ICP-3 — P1 (решение Ильи 9 Nov 2026)
    "ICP-1 PSP / acquiring": "P1"
    "ICP-2 Fintech / wallets / neobanks": "P1"
    "ICP-3 Cards / issuing / BaaS": "P1"
    "ICP-4 Cross-border / FX / PayFi": "P1"
    "ICP-5 Digital assets / crypto / RWA": "P2"
    "ICP-6 Investments / wealthtech": "P2"
    "ICP-7 Lending / credit / BNPL": "P2"
  status: ""                 # в корпоративной базе нет поля статуса
  source_option: "Pipeline"  # значение «Источник» для добавленных компаний (опция создастся сама)
  account_id_prefix: "HAIA-FIN-"

models:                      # алиасы Claude Code; работает на подписке аккаунта, где выполнен `claude login`
  research: "sonnet"
  write: "sonnet"
  review: "sonnet"
  verify_fallback: "haiku"

research:
  collect_days: 270          # окно сбора корпуса; в письмо идут только события ≤270 дней (SPEC §3)
  max_quote_words: 25
  llm_verify_fallback: true  # сайт закрыт для кода → проверка цитаты через WebFetch, пометка verified_llm

sender:
  name: "Ilia Frolov"
  title: "CRO & Product Architect, HAIA"
  site: "haia.finance"
  short: "Ilia"

timeouts:
  research_sec: 900
  write_sec: 300
  review_sec: 300
